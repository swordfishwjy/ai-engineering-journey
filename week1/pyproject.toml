[project]
name = "week1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "swordfishwjy", email = "swordfishwjy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.9.0",
    "fastapi>=0.163.1",
    "jinja2>=3.1.6",
    "openai>=3.52.0",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real model API (run with: uv run pytest -m live)"]
